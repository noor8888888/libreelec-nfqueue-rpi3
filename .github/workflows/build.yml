name: Build LibreELEC NFQUEUE modules

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            curl \
            g++ \
            gcc \
            git \
            gperf \
            make \
            openjdk-11-jre-headless \
            rsync \
            unzip \
            xfonts-utils \
            xsltproc \
            xz-utils \
            zip \
            python3 \
            python3-pip \
            wget

      - name: Clone LibreELEC 12.2.1
        run: |
          git clone --depth 1 --branch 12.2.1 \
            https://github.com/LibreELEC/LibreELEC.tv.git \
            libreelec

      - name: Enable NFQUEUE
        working-directory: libreelec
        run: |
          CONFIG="projects/RPi/devices/RPi2/linux/linux.arm.conf"

          echo "Before:"
          grep -E \
            'CONFIG_NETFILTER_NETLINK_QUEUE|CONFIG_NETFILTER_XT_TARGET_NFQUEUE' \
            "$CONFIG" || true

          sed -i \
            's/^# CONFIG_NETFILTER_NETLINK_QUEUE is not set$/CONFIG_NETFILTER_NETLINK_QUEUE=m/' \
            "$CONFIG"

          sed -i \
            's/^# CONFIG_NETFILTER_XT_TARGET_NFQUEUE is not set$/CONFIG_NETFILTER_XT_TARGET_NFQUEUE=m/' \
            "$CONFIG"

          echo "After:"
          grep -E \
            'CONFIG_NETFILTER_NETLINK_QUEUE|CONFIG_NETFILTER_XT_TARGET_NFQUEUE' \
            "$CONFIG"

      - name: Fix broken libtool mirror URL
        working-directory: libreelec
        run: |
          sed -i \
            's#http://ftpmirror.gnu.org/libtool/${PKG_NAME}-${PKG_VERSION}.tar.gz#https://ftp.gnu.org/gnu/libtool/${PKG_NAME}-${PKG_VERSION}.tar.gz#' \
            packages/devel/libtool/package.mk

          grep 'PKG_URL=' packages/devel/libtool/package.mk

      - name: Build LibreELEC Linux package
        working-directory: libreelec
        env:
          PROJECT: RPi
          ARCH: arm
          DEVICE: RPi2
          THREADCOUNT: 100%
          MTVERBOSE: yes
        run: |
          ./scripts/build linux

      - name: Find Linux package output
        working-directory: libreelec
        run: |
          echo "Searching for Linux install directory..."

          find build.LibreELEC-RPi.arm-* \
            -maxdepth 3 \
            -type d \
            -path '*/install_pkg/linux-*' \
            -print

      - name: Verify Module.symvers and NFQUEUE modules
        working-directory: libreelec
        run: |
          INSTALL_DIR=$(find build.LibreELEC-RPi.arm-* \
            -maxdepth 3 \
            -type d \
            -path '*/install_pkg/linux-*' \
            | head -n 1)

          if [ -z "$INSTALL_DIR" ]; then
            echo "ERROR: Linux install directory not found"
            exit 1
          fi

          echo "INSTALL_DIR=$INSTALL_DIR"

          echo
          echo "=== .image ==="
          ls -lh "$INSTALL_DIR/.image/"

          echo
          echo "=== Module.symvers ==="
          test -s "$INSTALL_DIR/.image/Module.symvers"
          ls -lh "$INSTALL_DIR/.image/Module.symvers"

          echo
          echo "=== NFQUEUE modules ==="
          find "$INSTALL_DIR" \
            -type f \
            \( \
              -name 'nfnetlink_queue.ko' \
              -o \
              -name 'xt_NFQUEUE.ko' \
            \) \
            -print

          echo
          echo "=== Kernel version ==="
          find "$INSTALL_DIR" \
            -type d \
            -path '*/lib/modules/*' \
            -print

          echo
          echo "=== Module information ==="

          NFQ=$(find "$INSTALL_DIR" \
            -type f \
            -name 'nfnetlink_queue.ko' \
            | head -n 1)

          XTFQ=$(find "$INSTALL_DIR" \
            -type f \
            -name 'xt_NFQUEUE.ko' \
            | head -n 1)

          test -n "$NFQ"
          test -n "$XTFQ"

          modinfo "$NFQ" || true
          modinfo "$XTFQ" || true

      - name: Prepare artifacts
        working-directory: libreelec
        run: |
          mkdir -p ../artifact

          INSTALL_DIR=$(find build.LibreELEC-RPi.arm-* \
            -maxdepth 3 \
            -type d \
            -path '*/install_pkg/linux-*' \
            | head -n 1)

          echo "INSTALL_DIR=$INSTALL_DIR"

          find "$INSTALL_DIR" \
            -type f \
            \( \
              -name 'nfnetlink_queue.ko' \
              -o \
              -name 'xt_NFQUEUE.ko' \
            \) \
            -exec cp {} ../artifact/ \;

          cp "$INSTALL_DIR/.image/Module.symvers" \
            ../artifact/

          cp "$INSTALL_DIR/.image/.config" \
            ../artifact/

          cp "$INSTALL_DIR/.image/System.map" \
            ../artifact/

          echo
          echo "=== Final artifacts ==="
          ls -lh ../artifact/

      - name: Upload NFQUEUE modules
        uses: actions/upload-artifact@v4
        with:
          name: libreelec-12.2.1-rpi3-nfqueue
          path: artifact/
          if-no-files-found: error
