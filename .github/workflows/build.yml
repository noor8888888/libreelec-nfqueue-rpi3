name: Build NFQUEUE modules for LibreELEC RPi3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            gcc-arm-linux-gnueabihf \
            make \
            kmod \
            cpio \
            xz-utils \
            tar

      - name: Clone exact Raspberry Pi kernel
        run: |
          git clone https://github.com/raspberrypi/linux.git linux
          cd linux
          git checkout 78fd5c93f1568d0dac7c56ee3d497739a63b058e

      - name: Copy LibreELEC RPi2 config
        run: |
          git clone --branch 12.2.1 --depth 1 \
            https://github.com/LibreELEC/LibreELEC.tv.git libreelec

          cp \
            libreelec/projects/RPi/devices/RPi2/linux/linux.arm.conf \
            linux/.config

      - name: Enable NFQUEUE modules
        working-directory: linux
        run: |
          sed -i \
            's/^# CONFIG_NETFILTER_NETLINK_QUEUE is not set$/CONFIG_NETFILTER_NETLINK_QUEUE=m/' \
            .config

          sed -i \
            's/^# CONFIG_NETFILTER_XT_TARGET_NFQUEUE is not set$/CONFIG_NETFILTER_XT_TARGET_NFQUEUE=m/' \
            .config

          echo "=== Requested configuration ==="
          grep -E \
            'CONFIG_NETFILTER_NETLINK_QUEUE|CONFIG_NETFILTER_XT_TARGET_NFQUEUE' \
            .config

      - name: Prepare kernel tree
        working-directory: linux
        run: |
          make ARCH=arm \
            CROSS_COMPILE=arm-linux-gnueabihf- \
            olddefconfig

          make ARCH=arm \
            CROSS_COMPILE=arm-linux-gnueabihf- \
            modules_prepare

      - name: Build NFQUEUE modules
        working-directory: linux
        run: |
          make -j2 ARCH=arm \
            CROSS_COMPILE=arm-linux-gnueabihf- \
            M=net/netfilter \
            modules

      - name: Find modules
        working-directory: linux
        run: |
          echo "=== Found modules ==="
          find . -type f \
            \( \
              -name 'nfnetlink_queue.ko' \
              -o \
              -name 'xt_NFQUEUE.ko' \
            \) \
            -print

      - name: Check module metadata
        working-directory: linux
        run: |
          echo "=== Module metadata ==="

          for module in \
            $(find . -type f \( \
              -name 'nfnetlink_queue.ko' \
              -o \
              -name 'xt_NFQUEUE.ko' \
            \)); do
            echo "----- $module -----"
            modinfo "$module" || true
            file "$module"
          done

      - name: Package modules
        run: |
          mkdir -p artifact/lib/modules/6.12.56

          find linux -type f \
            \( \
              -name 'nfnetlink_queue.ko' \
              -o \
              -name 'xt_NFQUEUE.ko' \
            \) \
            -exec cp {} artifact/lib/modules/6.12.56/ \;

          echo "=== Artifact contents ==="
          find artifact -type f -ls

          tar -czf \
            nfqueue-modules-rpi3-6.12.56.tar.gz \
            -C artifact .

      - name: Upload modules
        uses: actions/upload-artifact@v4
        with:
          name: nfqueue-modules-rpi3-6.12.56
          path: nfqueue-modules-rpi3-6.12.56.tar.gz
