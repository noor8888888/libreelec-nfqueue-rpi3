name: Build NFQUEUE modules for LibreELEC RPi3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            gcc-arm-linux-gnueabihf \
            make \
            kmod \
            cpio \
            xz-utils \
            tar \
            rsync

      - name: Clone exact Raspberry Pi kernel
        run: |
          set -e

          git clone \
            https://github.com/raspberrypi/linux.git \
            linux

          cd linux

          git checkout 78fd5c93f1568d0dac7c56ee3d497739a63b058e

          echo "=== Raspberry Pi kernel commit ==="
          git rev-parse HEAD

      - name: Clone LibreELEC 12.2.1
        run: |
          set -e

          git clone \
            --branch 12.2.1 \
            --depth 1 \
            https://github.com/LibreELEC/LibreELEC.tv.git \
            libreelec

      - name: Copy LibreELEC kernel configuration
        run: |
          set -e

          cp \
            libreelec/projects/RPi/devices/RPi2/linux/linux.arm.conf \
            linux/.config

          echo "=== LibreELEC kernel configuration ==="

          grep -E \
            'CONFIG_NETFILTER|CONFIG_NF|CONFIG_XTABLES' \
            linux/.config | head -100 || true

      - name: Enable required NFQUEUE configuration
        working-directory: linux
        run: |
          set -e

          echo "=== Enabling NFQUEUE ==="

          ./scripts/config --enable CONFIG_NETFILTER
          ./scripts/config --enable CONFIG_NETFILTER_NETLINK
          ./scripts/config --module CONFIG_NETFILTER_NETLINK_QUEUE

          ./scripts/config --enable CONFIG_NETFILTER_XTABLES
          ./scripts/config --module CONFIG_NETFILTER_XT_TARGET_NFQUEUE

          echo "=== NFQUEUE configuration before olddefconfig ==="

          grep -E \
            'CONFIG_NETFILTER_NETLINK_QUEUE|CONFIG_NETFILTER_XT_TARGET_NFQUEUE|CONFIG_NETFILTER_NETLINK=|CONFIG_NETFILTER_XTABLES=' \
            .config || true

      - name: Prepare kernel configuration
        working-directory: linux
        run: |
          set -e

          make \
            ARCH=arm \
            CROSS_COMPILE=arm-linux-gnueabihf- \
            olddefconfig

          echo "=== NFQUEUE configuration after olddefconfig ==="

          grep -E \
            'CONFIG_NETFILTER_NETLINK_QUEUE|CONFIG_NETFILTER_XT_TARGET_NFQUEUE|CONFIG_NETFILTER_NETLINK=|CONFIG_NETFILTER_XTABLES=' \
            .config || true

      - name: Prepare kernel tree
        working-directory: linux
        run: |
          set -e

          make \
            ARCH=arm \
            CROSS_COMPILE=arm-linux-gnueabihf- \
            modules_prepare

      - name: Build nfnetlink_queue module
        working-directory: linux
        run: |
          set -e

          echo "=== Building nfnetlink_queue ==="

          make -j2 \
            ARCH=arm \
            CROSS_COMPILE=arm-linux-gnueabihf- \
            M=net/netfilter \
            modules

      - name: Show resulting modules
        working-directory: linux
        run: |
          echo "=== NFQUEUE modules ==="

          find net -type f \
            \( \
              -name 'nfnetlink_queue.ko' \
              -o \
              -name 'xt_NFQUEUE.ko' \
            \) \
            -print

      - name: Check module information
        working-directory: linux
        run: |
          set -e

          echo "=== Module information ==="

          for module in \
            $(find net -type f \
              \( \
                -name 'nfnetlink_queue.ko' \
                -o \
                -name 'xt_NFQUEUE.ko' \
              \)); do

            echo
            echo "========================================"
            echo "$module"
            echo "========================================"

            file "$module"

            modinfo "$module" || true

          done

      - name: Verify required modules exist
        working-directory: linux
        run: |
          set -e

          echo "=== Verifying modules ==="

          test -f net/netfilter/nfnetlink_queue.ko
          test -f net/netfilter/xt_NFQUEUE.ko

          echo
          echo "SUCCESS:"
          echo "nfnetlink_queue.ko exists"
          echo "xt_NFQUEUE.ko exists"

      - name: Package modules
        run: |
          set -e

          mkdir -p artifact/lib/modules/6.12.56/kernel/net/netfilter

          cp \
            linux/net/netfilter/nfnetlink_queue.ko \
            artifact/lib/modules/6.12.56/kernel/net/netfilter/

          cp \
            linux/net/netfilter/xt_NFQUEUE.ko \
            artifact/lib/modules/6.12.56/kernel/net/netfilter/

          echo "=== Artifact contents ==="

          find artifact -type f -ls

          tar -czf \
            nfqueue-modules-rpi3-6.12.56.tar.gz \
            -C artifact .

      - name: Upload NFQUEUE modules
        uses: actions/upload-artifact@v4
        with:
          name: nfqueue-modules-rpi3-6.12.56
          path: nfqueue-modules-rpi3-6.12.56.tar.gz
