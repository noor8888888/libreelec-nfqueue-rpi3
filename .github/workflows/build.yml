name: Build NFQUEUE modules for LibreELEC RPi3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            make \
            gcc-arm-linux-gnueabihf \
            crossbuild-essential-armhf \
            rsync \
            ccache \
            python3 \
            unzip \
            kmod

      - name: Clone LibreELEC 12.2.1
        run: |
          git clone --branch 12.2.1 \
            https://github.com/LibreELEC/LibreELEC.tv.git

      - name: Download RPi2 sources
        working-directory: LibreELEC.tv
        run: |
          PROJECT=RPi DEVICE=RPi2 ARCH=arm tools/download-tool

      - name: Enable NFQUEUE
        working-directory: LibreELEC.tv
        run: |
          CONFIG=projects/RPi/devices/RPi2/linux/linux.arm.conf

          sed -i \
            's/^# CONFIG_NETFILTER_NETLINK_QUEUE is not set$/CONFIG_NETFILTER_NETLINK_QUEUE=m/' \
            "$CONFIG"

          sed -i \
            's/^# CONFIG_NETFILTER_XT_TARGET_NFQUEUE is not set$/CONFIG_NETFILTER_XT_TARGET_NFQUEUE=m/' \
            "$CONFIG"

          echo "=== NFQUEUE CONFIG ==="
          grep -E \
            'CONFIG_NETFILTER_NETLINK_QUEUE|CONFIG_NETFILTER_XT_TARGET_NFQUEUE' \
            "$CONFIG"

      - name: Build Linux package
        working-directory: LibreELEC.tv
        run: |
          PROJECT=RPi DEVICE=RPi2 ARCH=arm \
            scripts/build linux

      - name: Locate modules
        working-directory: LibreELEC.tv
        run: |
          echo "=== NFQUEUE MODULES ==="

          find . -type f \
            \( \
              -name 'nfnetlink_queue.ko' \
              -o \
              -name 'xt_NFQUEUE.ko' \
            \) \
            -print

      - name: Verify modules
        working-directory: LibreELEC.tv
        run: |
          echo "=== MODINFO ==="

          find . -type f \
            \( \
              -name 'nfnetlink_queue.ko' \
              -o \
              -name 'xt_NFQUEUE.ko' \
            \) \
            -exec modinfo {} \;

      - name: Prepare artifact
        run: |
          mkdir -p artifact/lib/modules/6.12.56

          find LibreELEC.tv -type f \
            \( \
              -name 'nfnetlink_queue.ko' \
              -o \
              -name 'xt_NFQUEUE.ko' \
            \) \
            -exec cp {} artifact/lib/modules/6.12.56/ \;

          echo "=== ARTIFACT ==="
          find artifact -type f -ls

          tar -czf \
            nfqueue-modules-rpi3-6.12.56.tar.gz \
            -C artifact .

      - name: Upload modules
        uses: actions/upload-artifact@v4
        with:
          name: nfqueue-modules-rpi3-6.12.56
          path: nfqueue-modules-rpi3-6.12.56.tar.gz
